name = "time-tracker"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "../docs"
binding = "ASSETS"
run_worker_first = ["/api/*", "/mcp", "/mcp/*", "/view", "/view/*"]

[[d1_databases]]
binding = "DB"
database_name = "time-tracker"
database_id = "REPLACE_WITH_YOUR_D1_ID"

# 时区：北京时间（分钟）。统计按这个时区切日期。
[vars]
TZ_OFFSET_MIN = "480"

# 密钥不写在这里，用命令设置：
#   npx wrangler secret put API_TOKEN    （读写，手机端和 AI 用）
#   npx wrangler secret put READ_TOKEN   （只读，给豆包这类只能打开网页的 AI）
